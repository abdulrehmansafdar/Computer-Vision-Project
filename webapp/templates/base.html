<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RTSD{% endblock %} — Railway Track Surface Defect Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">RTS<span>D</span></a>
        <nav>
            <a href="/" class="{% if active == 'home' %}active{% endif %}">Home</a>
            <a href="/detection" class="{% if active == 'detection' %}active{% endif %}">Detection</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        Railway Track Surface Defect Detection &mdash; YOLOv8 &mdash; project-hkopa Dataset
    </footer>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
