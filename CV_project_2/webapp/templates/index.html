<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Track Defect Detector</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Railway Track Defect Detector</h1>
            <p>Upload a railway track image to detect defects</p>
        </header>

        <div class="upload-area" id="dropZone">
            <div class="upload-content" id="uploadContent">
                <div class="icon">&#128202;</div>
                <p>Drag & drop an image here</p>
                <p class="subtitle">or click to browse</p>
                <input type="file" id="fileInput" accept="image/*" hidden>
            </div>
            <div class="preview hidden" id="previewArea">
                <img id="previewImg" alt="Preview">
            </div>
        </div>

        <button id="detectBtn" class="btn-primary" disabled>Detect Defects</button>

        <div class="loader hidden" id="loader">
            <div class="spinner"></div>
            <p>Analyzing image...</p>
        </div>

        <div class="results hidden" id="results">
            <h2>Detection Results</h2>
            <div class="result-grid">
                <div class="result-card">
                    <h3>Annotated Image</h3>
                    <img id="resultImg" alt="Detection result">
                </div>
                <div class="result-card">
                    <h3>Detected Defects (<span id="defectCount">0</span>)</h3>
                    <div class="defect-list" id="defectList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const uploadContent = document.getElementById('uploadContent');
        const previewImg = document.getElementById('previewImg');
        const detectBtn = document.getElementById('detectBtn');
        const loader = document.getElementById('loader');
        const results = document.getElementById('results');
        const resultImg = document.getElementById('resultImg');
        const defectCount = document.getElementById('defectCount');
        const defectList = document.getElementById('defectList');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                uploadContent.classList.add('hidden');
                previewArea.classList.remove('hidden');
                detectBtn.disabled = false;
                results.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            detectBtn.disabled = true;
            loader.classList.remove('hidden');
            results.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/predict', { method: 'POST', body: formData });
                const data = await res.json();

                resultImg.src = '/uploads/' + data.annotated_filename + '?t=' + Date.now();
                defectCount.textContent = data.total_defects;

                defectList.innerHTML = '';
                if (data.detections.length === 0) {
                    defectList.innerHTML = '<p class="no-defects">No defects detected</p>';
                } else {
                    data.detections.forEach((d, i) => {
                        const item = document.createElement('div');
                        item.className = 'defect-item';
                        const severity = d.confidence > 0.7 ? 'High' : d.confidence > 0.4 ? 'Medium' : 'Low';
                        item.innerHTML = `
                            <span class="defect-class">${d.class}</span>
                            <span class="defect-conf">${(d.confidence * 100).toFixed(0)}%</span>
                            <span class="defect-severity ${severity.toLowerCase()}">${severity}</span>
                        `;
                        defectList.appendChild(item);
                    });
                }

                results.classList.remove('hidden');
            } catch (err) {
                alert('Error processing image: ' + err.message);
            } finally {
                loader.classList.add('hidden');
                detectBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
